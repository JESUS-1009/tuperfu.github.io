<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Perfu</title>

  <!-- ==========================================================
       FUENTE
       ========================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ==========================================================
       IMAGENES PRODUCTOS
       ========================================================== */

    .producto .icono {
      width: 100%;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .producto .icono img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ==========================================================
       LINEA ROSA
       ========================================================== */

    .linea-rosa {
      width: min(600px, 80vw);
      height: 3px;
      background: #e8a6b8;
      margin: 0 auto 12px;
    }

    /* ==========================================================
       VARIABLES
       ========================================================== */

    :root {
      --papel: #e9dfc6;
      --papel-osc: #ded1ac;
      --tinta: #23301f;
      --tinta-suave: #5b6552;
      --mostaza: #d9a62e;
      --ladrillo: #b23a2f;
      --whatsapp: #25d366;
      --whatsapp-osc: #1da851;
      --mercado: #009ee3;
      --mercado-osc: #007eb5;
      --borde: rgba(35,48,31,0.18);
      --rosa: #e8a6b8;
      --radio: 4px;
    }

    /* ==========================================================
       CONFIGURACION GENERAL
       ========================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    /* ==========================================================
       BODY
       ========================================================== */

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      color: var(--tinta);
      font-family: 'Nunito', sans-serif;
      padding: 5px 16px 80px;
      overflow-x: hidden;
    }

    /* ==========================================================
       HEADER
       ========================================================== */

    header {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      width: min(360px, 60vw);
      height: auto;
      display: block;
      margin: 8px auto 10px;
    }

    .imagenes-debajo-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin: 0;
      flex-wrap: wrap;
    }

    .imagenes-debajo-logo img {
      width: clamp(70px, 7vw, 100px);
      height: clamp(70px, 7vw, 100px);
      object-fit: contain;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(32px, 5vw, 48px);
      margin: 2px 0 4px;
    }

    /* ==========================================================
       LAYOUT
       ========================================================== */

    .layout {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .layout > div {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ==========================================================
       FILTROS
       ========================================================== */

    .filtros {
      width: 100%;
      max-width: 900px;
      margin: 16px auto 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================================
       BUSCADOR
       ========================================================== */

    .buscador {
      width: min(100%, 560px);
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fdfaf1;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 0 12px;
    }

    .buscador span {
      color: var(--tinta-suave);
      font-size: 14px;
      flex-shrink: 0;
    }

    .buscador input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      padding: 9px 0;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: var(--tinta);
      outline: none;
    }

    /* ==========================================================
       CATEGORIAS
       ========================================================== */

    .tabs-categoria {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-categoria {
      border: 1px solid var(--borde);
      background: #fdfaf1;
      color: var(--tinta-suave);
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .02em;
      padding: 7px 13px;
      border-radius: var(--radio);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-categoria.activo {
      background: var(--tinta);
      color: var(--papel);
      border-color: var(--tinta);
    }

    /* ==========================================================
       ZONA PRODUCTOS
       ========================================================== */

    .zona-productos {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ==========================================================
       LINEAS DECORATIVAS
       ========================================================== */

    .linea-decorativa {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 130vw);
      height: 350px;
      pointer-events: none;
      z-index: 0;
      filter: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* ==========================================================
       PRODUCTOS
       ========================================================== */

    .sin-resultados {
      color: var(--tinta-suave);
      font-size: 14px;
      padding: 20px 4px;
    }

    .productos {
      position: relative;
      z-index: 1;
      width: min(100%, 850px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .producto {
      min-width: 0;
      background: #fdfaf1;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      cursor: pointer;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .producto:hover {
      transform: translateY(-3px);
      box-shadow:
        0 6px 18px rgba(35,48,31,.12);
    }

    .producto .categoria {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--tinta-suave);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 2px 5px;
      z-index: 2;
      background: rgba(253,250,241,.9);
    }

    .producto h3 {
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      padding-right: 45px;
      overflow-wrap: break-word;
    }

    .producto .precio {
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--ladrillo);
      font-size: 14px;
    }

    /* ==========================================================
       AGREGAR PRODUCTO
       ========================================================== */

    .producto .fila-agregar {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      overflow: hidden;
    }

    .stepper button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
    }

    .stepper button:hover {
      background: var(--papel-osc);
    }

    .stepper span {
      min-width: 28px;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
    }

    /* ==========================================================
       MODAL
       ========================================================== */

    .modal-producto {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .2s ease,
        visibility .2s ease;
    }

    .modal-producto.abierto {
      opacity: 1;
      visibility: visible;
    }

    .modal-producto-contenido {
      position: relative;
      width: min(560px, 92%);
      max-height: 85vh;
      overflow-y: auto;
      background: #fffdf6;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 20px;
      box-shadow:
        0 15px 45px rgba(0,0,0,.25);
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
      transform: translateY(10px);
      transition: transform .2s ease;
    }

    .modal-producto.abierto
    .modal-producto-contenido {
      transform: translateY(0);
    }

    .modal-cerrar {
      position: absolute;
      top: 10px;
      right: 14px;
      border: none;
      background: transparent;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      color: var(--tinta);
      z-index: 2;
    }

    .modal-cerrar:hover {
      color: var(--ladrillo);
    }

    .modal-producto-icono {
      min-height: 180px;
      height: 180px;
      border: 1px solid var(--borde);
      background: #fdfaf1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      border-radius: 6px;
      overflow: hidden;
    }

    .modal-producto-icono img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .modal-producto-categoria {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--tinta-suave);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 4px 7px;
    }

    .modal-producto-info h2 {
      font-family: 'Nunito', sans-serif;
      font-size: 23px;
      font-weight: 700;
      margin: 10px 35px 12px 0;
      color: var(--tinta);
    }

    .modal-producto-descripcion {
      font-family: 'Nunito', sans-serif;
      line-height: 1.5;
      color: var(--tinta-suave);
      font-size: 14px;
      margin: 0;
      white-space: pre-line;
    }

    .modal-producto-precio {
      font-family: 'Nunito', sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: var(--ladrillo);
      margin: 14px 0;
    }

    .modal-cantidad-titulo {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--tinta);
      margin-bottom: 6px;
    }

    .modal-cantidad {
      display: flex;
      align-items: center;
      width: max-content;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .modal-cantidad button {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      color: var(--tinta);
      font-family: 'Nunito', sans-serif;
    }

    .modal-cantidad button:hover {
      background: var(--papel-osc);
    }

    .modal-cantidad span {
      min-width: 40px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-agregar-modal {
      background: var(--tinta);
      color: var(--papel);
      transition: background .2s ease;
    }

    .btn-agregar-modal:hover {
      background: #172015;
    }

    /* ==========================================================
       CARRITO
       ========================================================== */

    .carrito-boton {
      position: fixed;
      bottom: 90px;
      left: clamp(20px, 10vw, 100px);
      width: 90px;
      height: 90px;
      border: 1px solid var(--borde);
      border-radius: 50%;
      background: #fffdf6;
      cursor: pointer;
      font-size: 34px;
      z-index: 1001;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .carrito-boton:hover {
      transform: scale(1.08);
    }

    /* ==========================================================
       WHATSAPP
       ========================================================== */

    .whatsapp-boton {
      position: fixed;
      bottom: 90px;
      left: clamp(130px, 18vw, 200px);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--whatsapp);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 1001;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.18);
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .whatsapp-boton svg {
      width: 43px;
      height: 43px;
      display: block;
      fill: #ffffff;
      flex-shrink: 0;
    }

    .whatsapp-boton:hover {
      transform: scale(1.08);
      background: var(--whatsapp-osc);
    }

    /* ==========================================================
       CONTADOR
       ========================================================== */

    .carrito-contador {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: 50%;
      background: var(--ladrillo);
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    /* ==========================================================
       CARRITO LATERAL
       ========================================================== */

    .ticket {
      position: fixed;
      top: 0;
      right: -420px;
      width: 390px;
      max-width: 90%;
      height: 100vh;
      overflow-y: auto;
      z-index: 1000;
      background: #fffdf6;
      border-left: 1px solid var(--borde);
      padding: 22px 18px 24px;
      box-shadow:
        -4px 0 15px rgba(0,0,0,0.15);
      transition: right 0.25s ease;
      scrollbar-width: thin;
    }

    .ticket.abierto {
      right: 0;
    }

    .ticket h2 {
      font-family: 'Nunito', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .02em;
      margin: 0 0 8px;
      border-bottom: 1px dashed var(--borde);
      padding-bottom: 8px;
    }

    .cerrar-carrito {
      position: absolute;
      top: 14px;
      right: 16px;
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      color: var(--tinta);
      font-family: 'Nunito', sans-serif;
    }

    .carrito-vacio {
      color: var(--tinta-suave);
      font-size: 14px;
      padding: 8px 0;
    }

    /* ==========================================================
       ITEMS CARRITO
       ========================================================== */

    .linea-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      padding: 6px 0;
      border-bottom:
        1px solid rgba(35,48,31,0.08);
    }

    .linea-item .nombre {
      color: var(--tinta);
      flex: 1;
      min-width: 0;
    }

    .linea-item .cant {
      color: var(--tinta-suave);
    }

    .linea-item .quitar {
      background: none;
      border: none;
      color: var(--ladrillo);
      cursor: pointer;
      font-size: 11px;
      padding: 0 0 0 5px;
      font-family: 'Nunito', sans-serif;
    }

    /* ==========================================================
       TOTAL
       ========================================================== */

    .total-fila {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px dashed var(--borde);
      margin-top: 8px;
      padding-top: 8px;
      font-family: 'Nunito', sans-serif;
    }

    .total-fila .label {
      font-size: 12px;
      color: var(--tinta-suave);
    }

    .total-fila .monto {
      font-size: 20px;
      font-weight: 600;
      color: var(--tinta);
    }

    /* ==========================================================
       DATOS CLIENTE
       ========================================================== */

    .datos {
      border-top: 1px dashed var(--borde);
      margin-top: 12px;
      padding-top: 10px;
    }

    .datos > strong {
      display: block;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .datos label {
      display: block;
      font-size: 11px;
      color: var(--tinta-suave);
      margin: 6px 0 3px;
    }

    .datos input,
    .datos select {
      width: 100%;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      background: white;
      color: var(--tinta);
      outline: none;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
    }

    .datos input:focus,
    .datos select:focus {
      border-color: var(--mostaza);
    }

    .datos select:disabled {
      background: #f3f0e8;
      color: var(--tinta-suave);
      cursor: not-allowed;
    }

    /* ==========================================================
       ENVIO
       ========================================================== */

    .envio {
      border-top: 1px dashed var(--borde);
      margin-top: 12px;
      padding-top: 10px;
    }

    .envio strong {
      display: block;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    /* ==========================================================
       BOTONES
       ========================================================== */

    .accion {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 7px;
      border: none;
      padding: 10px;
      border-radius: var(--radio);
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-pago {
      background: var(--mercado);
      color: white;
    }

    .btn-pago:hover:not(:disabled) {
      background: var(--mercado-osc);
    }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: white;
    }

    .btn-whatsapp:hover:not(:disabled) {
      background: var(--whatsapp-osc);
    }

    .accion:disabled {
      background: var(--papel-osc);
      color: var(--tinta-suave);
      cursor: not-allowed;
    }

    /* ==========================================================
       ESTADO
       ========================================================== */

    .estado {
      font-size: 12px;
      padding: 8px;
      margin-top: 7px;
      border-radius: 4px;
      background: #eef2e8;
    }

    .estado.error {
      background: #f8e3df;
      color: #7d241d;
    }

    .nota {
      font-size: 10px;
      color: var(--tinta-suave);
      margin-top: 7px;
      text-align: center;
    }

    /* ==========================================================
       PIE
       ========================================================== */

    .pie-pagina {
      text-align: center;
      margin-top: 28px;
      padding-top: 14px;
      color: var(--tinta-suave);
      font-size: 11px;
      font-family: 'Nunito', sans-serif;
    }

    /* ==========================================================
       TABLETS
       ========================================================== */

    @media (max-width: 700px) {

      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .layout {
        max-width: 1000px;
      }

      .productos {
        max-width: 900px;
      }

      .carrito-boton {
        left: 30px;
      }

      .whatsapp-boton {
        left: 145px;
      }

    }

    /* ==========================================================
       PANTALLAS MEDIANAS
       ========================================================== */

    @media (max-width: 900px) {

      body {
        padding-top: 14px;
      }

      .logo {
        width: min(350px, 65vw);
        height: auto;
        margin: 5px auto 15px;
      }

      .imagenes-debajo-logo img {
        width: 90px;
        height: 90px;
      }

      .filtros {
        margin-top: 20px;
      }

      .productos {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .producto {
        padding: 8px;
      }

      .carrito-boton {
        width: 80px;
        height: 80px;
        left: 20px;
        bottom: 25px;
        font-size: 30px;
      }

      .whatsapp-boton {
        width: 80px;
        height: 80px;
        left: 115px;
        bottom: 25px;
      }

      .whatsapp-boton svg {
        width: 38px;
        height: 38px;
      }

    }

    /* ==========================================================
       CELULAR
       ========================================================== */

    @media (max-width: 700px) {

      body {
        padding: 10px 10px 100px;
      }

      .logo {
        width: min(230px, 70vw);
        height: auto;
        margin: 5px auto 15px;
      }

      .imagenes-debajo-logo {
        gap: 3px;
      }

      .imagenes-debajo-logo img {
        width: 80px;
        height: 80px;
      }

      .filtros {
        margin-top: 22px;
      }

      .productos {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .producto {
        padding: 8px;
      }

      .producto h3 {
        font-size: 15px;
      }

      .producto .precio {
        font-size: 14px;
      }

      .producto .icono {
        height: 180px;
      }

      .linea-decorativa {
        top: 50px;
        left: 50%;
        width: 130%;
        height: 180px;
        opacity: 0.7;
      }

      .carrito-boton {
        width: 70px;
        height: 70px;
        left: auto;
        right: 20px;
        bottom: 25px;
        font-size: 28px;
      }

      .whatsapp-boton {
        width: 70px;
        height: 70px;
        left: auto;
        right: 105px;
        bottom: 25px;
      }

      .whatsapp-boton svg {
        width: 34px;
        height: 34px;
      }

      .carrito-contador {

    /* ==========================================================
       CARRITO
       ========================================================== */

    const carrito = {};

    const filtros = {
      categoria: "todos",
      busqueda: ""
    };

    /* ==========================================================
       MODAL
       ========================================================== */

    let productoModalId = null;

    let cantidadModal = 1;

    const modalProducto =
      document.getElementById("modal-producto");

    const modalCerrar =
      document.getElementById("modal-cerrar");

    const modalIcono =
      document.getElementById("modal-producto-icono");

    const modalCategoria =
      document.getElementById("modal-producto-categoria");

    const modalNombre =
      document.getElementById("modal-producto-nombre");

    const modalDescripcion =
      document.getElementById("modal-producto-descripcion");

    const modalPrecio =
      document.getElementById("modal-producto-precio");

    const modalCantidad =
      document.getElementById("modal-cantidad");

    const modalMenos =
      document.getElementById("modal-menos");

    const modalMas =
      document.getElementById("modal-mas");

    const modalAgregar =
      document.getElementById("modal-agregar");

    /* ==========================================================
       FORMATEAR PRECIO
       ========================================================== */

    function formatearPrecio(numero) {

      return numero.toLocaleString("es-AR", {

        style: "currency",

        currency: "ARS",

        maximumFractionDigits: 0

      });

    }

    /* ==========================================================
       FILTROS
       ========================================================== */

    function productosFiltrados() {

      const texto =
        filtros.busqueda
          .trim()
          .toLowerCase();

      return PRODUCTOS.filter(prod => {

        let pasaCategoria;

        if (
          filtros.categoria === "todos"
        ) {

          pasaCategoria = true;

        } else if (
          filtros.categoria === "oferta"
        ) {

          pasaCategoria =
            prod.oferta === true;

        } else {

          pasaCategoria =
            prod.categoria ===
            filtros.categoria;

        }

        const pasaBusqueda =
          prod.nombre
            .toLowerCase()
            .includes(texto);

        return (
          pasaCategoria &&
          pasaBusqueda
        );

      });

    }

    /* ==========================================================
       TOTAL
       ========================================================== */

    function totalCarrito() {

      return Object.keys(carrito).reduce(

        (total, id) => {

          const producto =
            PRODUCTOS.find(
              p => p.id === id
            );

          if (!producto) {
            return total;
          }

          return total +
            producto.precio *
            carrito[id];

        },

        0

      );

    }

    /* ==========================================================
       CONTADOR
       ========================================================== */

    function actualizarContadorCarrito() {

      const cantidad =
        Object.values(carrito).reduce(

          (total, cantidad) =>
            total + cantidad,

          0

        );

      document.getElementById(
        "carrito-contador"
      ).textContent = cantidad;

    }

    /* ==========================================================
       ABRIR PRODUCTO
       ========================================================== */

    function abrirProducto(id) {

      const producto =
        PRODUCTOS.find(
          p => p.id === id
        );

      if (!producto) return;

      productoModalId = id;

      cantidadModal =
        carrito[id] > 0
          ? carrito[id]
          : 1;

      if (producto.imagen) {

        modalIcono.innerHTML = `
          <img
            src="${producto.imagen}"
            alt="${producto.nombre}"
          >
        `;

      } else {

        modalIcono.textContent = "🧴";

      }

      modalCategoria.textContent =
        producto.categoria;

      modalNombre.textContent =
        producto.nombre;

      modalDescripcion.textContent =
        producto.descripcion;

      modalPrecio.textContent =
        formatearPrecio(
          producto.precio
        );

      modalCantidad.textContent =
        cantidadModal;

      modalProducto.classList.add(
        "abierto"
      );

      modalProducto.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";

    }

    /* ==========================================================
       CERRAR PRODUCTO
       ========================================================== */

    function cerrarProducto() {

      modalProducto.classList.remove(
        "abierto"
      );

      modalProducto.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";

      productoModalId = null;

    }

    /* ==========================================================
       CANTIDAD MODAL
       ========================================================== */

    modalMenos.addEventListener(
      "click",
      () => {

        cantidadModal =
          Math.max(
            1,
            cantidadModal - 1
          );

        modalCantidad.textContent =
          cantidadModal;

      }
    );

    modalMas.addEventListener(
      "click",
      () => {

        cantidadModal++;

        modalCantidad.textContent =
          cantidadModal;

      }
    );

    /* ==========================================================
       AGREGAR DESDE MODAL
       ========================================================== */

    modalAgregar.addEventListener(
      "click",
      () => {

        if (!productoModalId) return;

        carrito[productoModalId] =
          cantidadModal;

        pintarProductos();

        pintarCarrito();

        cerrarProducto();

      }
    );

    /* ==========================================================
       CERRAR MODAL
       ========================================================== */

    modalCerrar.addEventListener(
      "click",
      cerrarProducto
    );

    modalProducto.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalProducto
        ) {

          cerrarProducto();

        }

      }
    );

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          modalProducto.classList.contains(
            "abierto"
          )
        ) {

          cerrarProducto();

        }

      }
    );

    /* ==========================================================
       MOSTRAR PRODUCTOS
       ========================================================== */

    function pintarProductos() {

      const cont =
        document.getElementById(
          "productos"
        );

      const lista =
        productosFiltrados();

      if (lista.length === 0) {

        cont.innerHTML = `

          <p class="sin-resultados">
            No encontramos perfumes con ese filtro.
          </p>

        `;

        return;

      }

      cont.innerHTML =
        lista.map(prod => `

        <div
          class="producto"
          data-producto-id="${prod.id}"
        >

          <span class="categoria">
            ${prod.categoria}
          </span>

          <div class="icono">

            ${
              prod.imagen
                ? `
                  <img
                    src="${prod.imagen}"
                    alt="${prod.nombre}"
                  >
                `
                : "🧴"
            }

          </div>

          <h3>
            ${prod.nombre}
          </h3>

          <div class="precio">
            ${formatearPrecio(prod.precio)}
          </div>

          <div class="fila-agregar">

            <div class="stepper">

              <button
                type="button"
                class="btn-cantidad-menos"
                data-id="${prod.id}"
              >
                −
              </button>

              <span id="cant-${prod.id}">
                ${carrito[prod.id] || 0}
              </span>

              <button
                type="button"
                class="btn-cantidad-mas"
                data-id="${prod.id}"
              >
                +
              </button>

            </div>

          </div>

        </div>

      `).join("");

    }

    /* ==========================================================
       CLIC PRODUCTOS
       ========================================================== */

    document
      .getElementById("productos")
      .addEventListener(
        "click",
        event => {

          const botonMenos =
            event.target.closest(
              ".btn-cantidad-menos"
            );

          const botonMas =
            event.target.closest(
              ".btn-cantidad-mas"
            );

          if (botonMenos) {

            cambiarCantidad(
              botonMenos.dataset.id,
              -1
            );

            return;

          }

          if (botonMas) {

            cambiarCantidad(
              botonMas.dataset.id,
              1
            );

            return;

          }

          const tarjeta =
            event.target.closest(
              ".producto"
            );

          if (!tarjeta) return;

          abrirProducto(
            tarjeta.dataset.productoId
          );

        }
      );

    /* ==========================================================
       MOSTRAR CARRITO
       ========================================================== */

    function pintarCarrito() {

      const cont =
        document.getElementById(
          "lineas-carrito"
        );

      const ids =
        Object.keys(carrito)
          .filter(
            id => carrito[id] > 0
          );

      if (ids.length === 0) {

        cont.innerHTML = `

          <p class="carrito-vacio">
            Todavía no agregaste nada.
          </p>

        `;

      } else {

        cont.innerHTML =
          ids.map(id => {

            const prod =
              PRODUCTOS.find(
                p => p.id === id
              );

            if (!prod) {
              return "";
            }

            const cant =
              carrito[id];

            const subtotal =
              prod.precio * cant;

            return `

              <div class="linea-item">

                <span class="nombre">

                  ${prod.nombre}

                  <span class="cant">
                    ×${cant}
                  </span>

                </span>

                <span>

                  ${formatearPrecio(
                    subtotal
                  )}

                  <button
                    class="quitar"
                    type="button"
                    onclick="quitarDelCarrito('${id}')"
                  >
                    quitar
                  </button>

                </span>

              </div>

            `;

          }).join("");

      }

      const total =
        totalCarrito();

      document.getElementById(
        "total-monto"
      ).textContent =
        formatearPrecio(total);

      document.getElementById(
        "btn-pago"
      ).disabled =
        total === 0;

      document.getElementById(
        "btn-whatsapp"
      ).disabled =
        total === 0;

      actualizarContadorCarrito();

    }

    /* ==========================================================
       CAMBIAR CANTIDAD
       ========================================================== */

    function cambiarCantidad(
      id,
      delta
    ) {

      const actual =
        carrito[id] || 0;

      const nueva =
        Math.max(
          0,
          actual + delta
        );

      carrito[id] =
        nueva;

      const span =
        document.getElementById(
          `cant-${id}`
        );

      if (span) {

        span.textContent =
          nueva;

      }

      pintarCarrito();

    }

    /* ==========================================================
       QUITAR
       ========================================================== */

    function quitarDelCarrito(id) {

      carrito[id] = 0;

      pintarProductos();

      pintarCarrito();

    }

    /* ==========================================================
       ABRIR CARRITO
       ========================================================== */

    document
      .getElementById(
        "carrito-boton"
      )
      .addEventListener(
        "click",

          document
            .getElementById("ticket")
            .classList.add(

            );

        }
      );

       CERRAR CARRITO

        "cerrar-carrito"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById("ticket")
            .classList.remove(
              "abierto"
            );

        }
      );

    /* ==========================================================

      );

    const otraLocalidadContainer =

      );

    const otraLocalidadInput =

    /* ==========================================================

    const localidadesPorProvincia = {

    /* ==========================================================
       CARGAR PROVINCIAS
       ========================================================== */

    function cargarProvincias() {

      selectProvincia.innerHTML = `

        <option value="">
          Seleccioná una provincia
        </option>

      `;

      provinciasArgentina
        .sort((a, b) =>
          a.localeCompare(b, "es")
        )
        .forEach(provincia => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            provincia;

          option.textContent =
            provincia;

          selectProvincia.appendChild(
            option
          );

        });

    }

    /* ==========================================================
       CARGAR LOCALIDADES
       ========================================================== */

    function cargarLocalidades(
      provincia
    ) {

      selectLocalidad.disabled =
        true;

      selectLocalidad.innerHTML = `

        <option value="">
          Seleccioná una localidad
        </option>

      `;

      otraLocalidadContainer.style.display =
        "none";

      otraLocalidadInput.value =
        "";

      if (!provincia) {

        selectLocalidad.innerHTML = `

          <option value="">
            Primero seleccioná una provincia
          </option>

        `;

        return;

      }

      const localidades =
        localidadesPorProvincia[
          provincia
        ] || [];

      const localidadesOrdenadas =
        [...localidades].sort(
          (a, b) =>
            a.localeCompare(
              b,
              "es"
            )
        );

      localidadesOrdenadas.forEach(
        localidad => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            localidad;

          option.textContent =
            localidad;

          selectLocalidad.appendChild(
            option
          );

        }
      );

      const otraOption =
        document.createElement(
          "option"
        );

      otraOption.value =
        "__OTRA__";

      otraOption.textContent =
        "Otra localidad";

      selectLocalidad.appendChild(
        otraOption
      );

      selectLocalidad.disabled =
        false;

    }

    /* ==========================================================
       CAMBIO PROVINCIA
       ========================================================== */

    selectProvincia.addEventListener(
      "change",
      event => {

        cargarLocalidades(
          event.target.value
        );

      }
    );

    /* ==========================================================
       CAMBIO LOCALIDAD
       ========================================================== */

    selectLocalidad.addEventListener(
      "change",
      event => {

        if (
          event.target.value ===
          "__OTRA__"
        ) {

          otraLocalidadContainer.style.display =
            "block";

          otraLocalidadInput.focus();

        } else {

          otraLocalidadContainer.style.display =
            "none";

          otraLocalidadInput.value =
            "";

        }

      }
    );

    /* ==========================================================
       OBTENER LOCALIDAD
       ========================================================== */

    function obtenerLocalidad() {

      const seleccion =
        selectLocalidad.value;

      if (
        seleccion === "__OTRA__"
      ) {

        return otraLocalidadInput
          .value
          .trim();

      }

      return seleccion.trim();

    }

    /* ==========================================================
       DATOS CLIENTE
       ========================================================== */

    function obtenerDatosCliente() {

      return {

        nombre:
          document
            .getElementById("nombre")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim(),

        telefono:
          document
            .getElementById("telefono")
            .value
            .trim(),

        direccion:
          document
            .getElementById("direccion")
            .value
            .trim(),

        localidad:
          obtenerLocalidad(),

        provincia:
          selectProvincia.value.trim(),

        codigoPostal:
          document
            .getElementById(
              "codigo-postal"
            )
            .value
            .trim()

      };

    }

    /* ==========================================================
       VALIDAR DATOS
       ========================================================== */

    function validarDatos() {

      const datos =
        obtenerDatosCliente();

      if (!datos.nombre) {

        mostrarEstado(
          "Ingresá tu nombre.",
          "error"
        );

        return null;

      }

      if (!datos.email) {

        mostrarEstado(
          "Ingresá tu email.",
          "error"
        );

        return null;

      }

      const emailValido =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/
          .test(
            datos.email
          );

      if (!emailValido) {

        mostrarEstado(
          "Ingresá un email válido.",
          "error"
        );

        return null;

      }

      if (!datos.direccion) {

        mostrarEstado(
          "Ingresá la dirección de envío.",
          "error"
        );

        return null;

      }

      if (!datos.provincia) {

        mostrarEstado(
          "Seleccioná una provincia.",
          "error"
        );

        return null;

      }

      if (!datos.localidad) {

        mostrarEstado(
          "Seleccioná o escribí una localidad.",
          "error"
        );

        return null;

      }

      if (!datos.codigoPostal) {

        mostrarEstado(
          "Ingresá el código postal.",
          "error"
        );

        return null;

      }

      if (
        totalCarrito() <= 0
      ) {

        mostrarEstado(
          "El carrito está vacío.",
          "error"
        );

        return null;

      }

      return datos;

    }

    /* ==========================================================
       ITEMS
       ========================================================== */

    function obtenerItems() {

      return Object.keys(carrito)

        .filter(
          id => carrito[id] > 0
        )

        .map(id => {

          const producto =
            PRODUCTOS.find(
              p => p.id === id
            );

          return {

            id: producto.id,

            nombre: producto.nombre,

            precio: producto.precio,

            cantidad: carrito[id]

          };

        });

    }

    /* ==========================================================
       MENSAJE WHATSAPP
       ========================================================== */

    function armarMensajePedido() {

      const datos =
        obtenerDatosCliente();

      const items =
        obtenerItems();

      const lineas = [

        "¡Hola! Quiero hacer este pedido:",

        "",

        `Cliente: ${datos.nombre}`,

        `Email: ${datos.email}`

      ];

      if (datos.telefono) {

        lineas.push(
          `Teléfono: ${datos.telefono}`
        );

      }

      lineas.push("");

      lineas.push(
        "📦 Envío por Correo Argentino:"
      );

      lineas.push(
        `Dirección: ${datos.direccion}`
      );

      lineas.push(
        `Localidad: ${datos.localidad}`
      );

      lineas.push(
        `Provincia: ${datos.provincia}`
      );

      lineas.push(
        `Código Postal: ${datos.codigoPostal}`
      );

      lineas.push("");

      items.forEach(item => {

        lineas.push(

          `• ${item.nombre} x${item.cantidad} — ` +
          `${formatearPrecio(
            item.precio *
            item.cantidad
          )}`

        );

      });

      lineas.push("");

      lineas.push(

        `Total: ${formatearPrecio(
          totalCarrito()
        )}`

      );

      return lineas.join(
        "\n"
      );

    }

    /* ==========================================================
       BOTON WHATSAPP
       ========================================================== */

    document
      .getElementById(
        "btn-whatsapp"
      )
      .addEventListener(
        "click",
        () => {

          const datos =
            validarDatos();

          if (!datos) return;

          const mensaje =
            armarMensajePedido();

          const url =
            `https://wa.me/${NUMERO_WHATSAPP}` +
            `?text=${encodeURIComponent(mensaje)}`;

          window.open(
            url,
            "_blank"
          );

        }
      );

    /* ==========================================================
       MERCADO PAGO
       ========================================================== */

    document
      .getElementById(
        "btn-pago"
      )
      .addEventListener(
        "click",
        async () => {

          const datos =
            validarDatos();

          if (!datos) return;

          const boton =
            document.getElementById(
              "btn-pago"
            );

          boton.disabled =
            true;

          mostrarEstado(
            "Preparando el pago..."
          );

          try {

            const respuesta =
              await fetch(
                "/api/create-preference",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({

                      cliente:
                        datos,

                      items:
                        obtenerItems()

                    })

                }
              );

            const resultado =
              await respuesta.json();

            if (!respuesta.ok) {

              throw new Error(

                resultado.error ||
                "No se pudo crear el pago."

              );

            }

            if (
              !resultado.init_point
            ) {

              throw new Error(

                "Mercado Pago no devolvió el enlace de pago."

              );

            }

            window.location.href =
              resultado.init_point;

          } catch (error) {

            console.error(
              "Error:",
              error
            );

            mostrarEstado(
              error.message,
              "error"
            );

            boton.disabled =
              false;

          }

        }
      );

    /* ==========================================================
       ESTADO
       ========================================================== */

    function mostrarEstado(
      mensaje,
      tipo = ""
    ) {

      const estado =
        document.getElementById(
          "estado"
        );

      estado.textContent =
        mensaje;

      estado.className =
        `estado ${tipo}`;

      estado.hidden =
        false;

    }

    /* ==========================================================
       BUSCADOR
       ========================================================== */

    document
      .getElementById(
        "input-busqueda"
      )
      .addEventListener(
        "input",
        event => {

          filtros.busqueda =
            event.target.value;

          pintarProductos();

        }
      );

    /* ==========================================================
       CATEGORIAS
       ========================================================== */

    document
      .getElementById(
        "tabs-categoria"
      )
      .addEventListener(
        "click",
        event => {

          const boton =
            event.target.closest(
              ".tab-categoria"
            );

          if (!boton) return;

          filtros.categoria =
            boton.dataset.cat;

          document
            .querySelectorAll(
              ".tab-categoria"
            )
            .forEach(b => {

              b.classList.remove(
                "activo"
              );

            });

          boton.classList.add(
            "activo"
          );

          pintarProductos();

        }
      );

    /* ==========================================================
       INICIO
       ========================================================== */

    cargarProvincias();

    pintarProductos();

    pintarCarrito();

  </script>
